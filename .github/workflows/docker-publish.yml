# Publish the OCM website image to GHCR.
# Express path: manual workflow_dispatch with a version input. No Changie,
# no GPG tag, no release-PR chain. The image bakes the validator page set
# (validator + statistics; no home, no observatory) and no deployment
# URLs or contact. Each deployment supplies its own runtime /config.json
# and owns root routing at the edge.

name: Publish ocm-web image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/mahdibaghbani/ocm-web-site

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: setup buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: login ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          load: false
          build-args: |
            ASTRO_BASE=/
            SITE_PAGES=validator,statistics
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
